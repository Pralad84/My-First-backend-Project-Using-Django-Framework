{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .register-container{
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        .register-container h2{
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group{
            margin-bottom: 15px;
        }

        .input-group label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .input-group input:focus{
            border-color: #007bff;
        }

        .btn{
            width: 100%;
            padding: 10px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover{
            background: #0056b3;
        }

        .login-link{
            text-align: center;
            margin-top: 15px;
        }

        .login-link a{
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h2>Signup</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn">
                Register
            </button>

        </form>

        <div class="login-link">
            <p>
                Already have an account?
                <a href="">Login</a>
            </p>
        </div>

    </div>

</body>
</html>
